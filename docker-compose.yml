services:
  mongo:
    image: mongo:7
    container_name: realtime-chat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: realtime-chat-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/realtime-chat
      JWT_SECRET: cambia_esta_clave_larga_para_jwt
      ADMIN_USER: admin
      ADMIN_PASS: admin123
      PIN_PEPPER: cambia_esta_clave_larga_para_huellas_y_cifrado
    ports:
      - "3000:3000"
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: realtime-chat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_SOCKET_URL: http://localhost:3000
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"

volumes:
  mongo-data:
  backend-uploads:
